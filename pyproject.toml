[project]
name = "sandwitches"
version = "2.13.8"
description = "Sandwitches recipe platform — Go backend with Playwright UI test suite"
readme = "README.md"
authors = [
    { name = "Martyn van Dijke", email = "martijnvdijke600@gmail.com" }
]

requires-python = ">=3.12"

dependencies = []

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-playwright>=0.7.2",
    "pytest>=8.4.2",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests_go"]
pytest_playwright_sync_api = true
