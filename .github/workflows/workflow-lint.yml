name: Workflow Lint

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12
        with:
          fail-on-error: true

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.6.1
        with:
          persona: regular

      - name: Setup Go for pinact
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Check action pins (pinact)
        run: |
          go install github.com/suzuki-shunsuke/pinact/cmd/pinact@latest
          pinact run --check
        shell: bash
