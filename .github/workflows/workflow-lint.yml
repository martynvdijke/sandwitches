name: Workflow Lint

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12
        with:
          fail-on-error: true

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          persona: regular

      - name: Setup Go for pinact
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Check action pins (pinact)
        run: |
          go install github.com/suzuki-shunsuke/pinact/cmd/pinact@latest
          pinact run --check || echo "::warning::pinact found unpinned actions"
        shell: bash
