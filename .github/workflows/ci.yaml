name: CI

on:
  workflow_call:
  push:
    branches-ignore:
      - 'main'
  pull_request:
    branches:
      - "**"

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build Go binary for UI tests
        working-directory: go-app
        run: go build -o sandwitches-go .
      - name: Install Python dependencies
        run: uv sync --dev
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium
      - name: Run tests
        run: uv run pytest
        env:
          SECRET_KEY: test-secret-key

  test-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go mod download
      - run: go vet ./...
      - run: go test -v ./...

  otel:
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    if: always()
    name: OpenTelemetry Export Trace
    runs-on: ubuntu-latest
    needs: [test-python, test-go]
    steps:
      - name: Export workflow
        uses: corentinmusard/otel-cicd-action@v4
        with:
          otlpEndpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlpHeaders: ${{ secrets.OTLP_HEADERS }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
