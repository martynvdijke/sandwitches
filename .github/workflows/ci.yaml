name: CI

on:
  workflow_call:
  push:
    branches-ignore:
      - 'main'
  pull_request:
    branches:
      - "**"

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Build frontend bundle for UI tests
        run: |
          npm ci
          npm run build
      - name: Build Go binary for UI tests
        run: go build -o sandwitches-go .
      - name: Install Python dependencies
        run: uv sync --dev
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium
      - name: Run tests
        run: uv run pytest
        env:
          SECRET_KEY: test-secret-key

  test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go mod download
      - run: go vet ./...
      - run: go test -v ./...

  otel:
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    if: always()
    name: OpenTelemetry Export Trace
    runs-on: ubuntu-latest
    needs: [test-python, test-go]
    steps:
      - name: Export workflow
        uses: corentinmusard/otel-cicd-action@895874bfae14f840e3032f1a14c3f2b45c93f4af # v4.1.1
        with:
          otlpEndpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlpHeaders: ${{ secrets.OTLP_HEADERS }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
