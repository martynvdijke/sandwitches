name: trml

on:
  workflow_call:
  pull_request:

jobs:
  lint:
    name: TRMNL lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1.322.0
        with:
          ruby-version: "4.0.7"
      - run: gem install trmnl_preview
      - run: trmnlp lint --dir trmnl

  push:
    name: TRMNL push
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1.322.0
        with:
          ruby-version: "4.0.7"
      - run: gem install trmnl_preview
      - name: Require existing TRMNL plugin ID
        run: |
          plugin_id=$(ruby -e 'require "yaml"; puts YAML.load_file("trmnl/src/settings.yml")["id"].to_s.strip')
          if [ -z "$plugin_id" ]; then
            echo "::error::trmnl/src/settings.yml has no 'id' set. Set the plugin ID (see 'trmnlp list' or the TRMNL dashboard) so 'trmnlp push' updates the existing plugin instead of creating a new one."
            exit 1
          fi
          echo "TRMNL plugin ID: $plugin_id"
      - run: trmnlp push --force --dir trmnl
        env:
          TRMNL_API_KEY: ${{ secrets.TRML_TOKEN }}
