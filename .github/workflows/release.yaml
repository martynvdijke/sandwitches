name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  android-build:
    needs: ci
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: Android APK (build check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

  release:
    needs: [ci, android-build]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      packages: write
      attestations: write
      id-token: write

    outputs:
      new_release_published: ${{ steps.tagcheck.outputs.tag != '' && 'true' || steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.tagcheck.outputs.tag || steps.semantic.outputs.new_release_version }}

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      - name: Check for existing release tag
        id: tagcheck
        run: |
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Semantic Release
        id: semantic
        if: steps.tagcheck.outputs.tag == ''
        uses: cycjimmy/semantic-release-action@b4630c55afc332e0d8a732e0441849968e5cccaf # v8.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the Docker image
        if: steps.tagcheck.outputs.tag != '' || steps.semantic.outputs.new_release_published == 'true'
        run: docker build . --file Dockerfile --build-arg VERSION="$VERSION" --tag martynvandijke/sandwitches:latest
        env:
          VERSION: ${{ steps.tagcheck.outputs.tag || steps.semantic.outputs.new_release_version }}

      - name: Push Docker image
        if: steps.tagcheck.outputs.tag != '' || steps.semantic.outputs.new_release_published == 'true'
        run: |
          docker tag martynvandijke/sandwitches:latest ghcr.io/martynvdijke/sandwitches:latest
          docker push martynvandijke/sandwitches:latest
          docker push ghcr.io/martynvdijke/sandwitches:latest
          VERSION="${{ steps.tagcheck.outputs.tag || steps.semantic.outputs.new_release_version }}"
          echo "Pushing versioned tag: $VERSION"
          docker tag martynvandijke/sandwitches:latest martynvandijke/sandwitches:$VERSION
          docker tag martynvandijke/sandwitches:latest ghcr.io/martynvdijke/sandwitches:$VERSION
          docker push martynvandijke/sandwitches:$VERSION
          docker push ghcr.io/martynvdijke/sandwitches:$VERSION

  notify:
    needs: [ci, release]
    if: ${{ always() }}
    name: Gotify Notification
    runs-on: ubuntu-latest
    steps:
      - name: Release Published Notification
        if: needs.ci.result == 'success' && needs.release.result == 'success' && needs.release.outputs.new_release_published == 'true'
        uses: eikendev/gotify-action@cb63800546f25c393ab96f09d12a094138c514f4 # master
        with:
          gotify_api_base: ${{ secrets.GOTIFY_API_BASE }}
          gotify_app_token: ${{ secrets.GOTIFY_APP_TOKEN }}
          notification_title: '${{ github.repository }} Release Published - ${{ needs.release.outputs.new_release_version }}'
          notification_message: '${{ github.repository }}: Version ${{ needs.release.outputs.new_release_version }} was successfully released.'

      - name: No Release Needed Notification
        if: needs.ci.result == 'success' && needs.release.result == 'success' && needs.release.outputs.new_release_published != 'true'
        uses: eikendev/gotify-action@cb63800546f25c393ab96f09d12a094138c514f4 # master
        with:
          gotify_api_base: ${{ secrets.GOTIFY_API_BASE }}
          gotify_app_token: ${{ secrets.GOTIFY_APP_TOKEN }}
          notification_title: '${{ github.repository }} Release - Up to Date'
          notification_message: 'Workflow passed but no new release was published.'

      - name: Failure Notification
        if: needs.ci.result != 'success' || needs.release.result != 'success'
        uses: eikendev/gotify-action@cb63800546f25c393ab96f09d12a094138c514f4 # master
        with:
          gotify_api_base: ${{ secrets.GOTIFY_API_BASE }}
          gotify_app_token: ${{ secrets.GOTIFY_APP_TOKEN }}
          notification_title: 'Release Failed'
          notification_message: 'The release workflow has failed. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          notification_priority: 5
  trml:
    if: needs.release.result == 'success' && needs.release.outputs.new_release_published == 'true'
    name: TRMNL
    uses: ./.github/workflows/trml.yaml
    needs: [ci, release]
    secrets: inherit

  android:
    needs: [ci, release]
    if: needs.release.outputs.new_release_published == 'true'
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Build APK
        run: |
          cd mobile && flutter pub get && flutter build apk --release
          cp mobile/build/app/outputs/flutter-apk/app-release.apk sandwitches-${{ needs.release.outputs.new_release_version }}-android.apk

      - name: Upload APK to release
        run: gh release upload "v${{ needs.release.outputs.new_release_version }}" "sandwitches-${{ needs.release.outputs.new_release_version }}-android.apk" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  otel:
    permissions:
      contents: read # Required. To access the private repository
      actions: read # Required. To read workflow runs
      pull-requests: read # Optional. To read PR labels
      checks: read # Optional. To read run annotations
    if: always()
    name: OpenTelemetry Export Trace
    runs-on: ubuntu-latest
    needs: [ci, android-build, release, notify, trml, android]
    steps:
      - name: Export workflow
        uses: corentinmusard/otel-cicd-action@4826b79d63662fa91657272e7711420cb6aea543 # v4.2.0
        with:
          otlpEndpoint: ${{ secrets.OTLP_ENDPOINT }}
          otlpHeaders: ${{ secrets.OTLP_HEADERS }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
