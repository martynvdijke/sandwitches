plugins:
  - [
      "@semantic-release/commit-analyzer",
      {
        "releaseRules": [
          { "type": "chore", "scope": "deps", "release": "patch" },
          { "type": "chore", "scope": "dependencies", "release": "patch" },
          { "type": "refactor", "release": "patch" },
          { "type": "style", "release": "patch" }
        ]
      }
    ]
  - "@semantic-release/release-notes-generator"
  - "@semantic-release/changelog"
  - [
      "@semantic-release/exec",
      {
        prepareCmd: "uv version ${nextRelease.version} && npm version ${nextRelease.version} --no-git-tag-version --allow-same-version && sed -i -E \"s/^version:.*/version: ${nextRelease.version}+1/\" mobile/pubspec.yaml && (cd mobile && flutter pub get && flutter build apk --release) && cp mobile/build/app/outputs/flutter-apk/app-release.apk \"sandwitches-${nextRelease.version}-android.apk\"",
      },
    ]
  - [
      "@semantic-release/git",
      {
        message: "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}",
        assets: ["CHANGELOG.md", "pyproject.toml", "package.json", "uv.lock", "mobile/pubspec.yaml"],
      },
    ]
  - [
      "@semantic-release/github",
      { "assets": ["sandwitches-*-android.apk"] },
    ]

branches:
  - main
