plugins:
  - [
      "@semantic-release/commit-analyzer",
      {
        "releaseRules": [
          { "type": "chore", "scope": "deps", "release": "patch" },
          { "type": "chore", "scope": "dependencies", "release": "patch" },
          { "type": "refactor", "release": "patch" },
          { "type": "style", "release": "patch" }
        ]
      }
    ]
  - "@semantic-release/release-notes-generator"
  - "@semantic-release/changelog"
  - [
      "@semantic-release/exec",
      {
        prepareCmd: "VERSION='${nextRelease.version}' && CODE=$(echo \"$VERSION\" | awk -F. '{printf \"%d%03d%03d\", $1, $2, $3}') && uv version \"$VERSION\" && npm version \"$VERSION\" --no-git-tag-version --allow-same-version && sed -i -E \"s/^version:.*/version: $VERSION+$CODE/\" mobile/pubspec.yaml && (cd mobile && flutter pub get && flutter build apk --release) && cp mobile/build/app/outputs/flutter-apk/app-release.apk \"sandwitches-$VERSION-android.apk\"",
      },
    ]
  - [
      "@semantic-release/git",
      {
        message: "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}",
        assets: ["CHANGELOG.md", "pyproject.toml", "package.json", "uv.lock", "mobile/pubspec.yaml"],
      },
    ]
  - [
      "@semantic-release/github",
      { "assets": ["sandwitches-*-android.apk"] },
    ]

branches:
  - main
