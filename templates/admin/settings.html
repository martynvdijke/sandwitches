{{ template "admin_head" . }}{{ template "admin_nav" . }}<main class="responsive"><div class="large-space"></div><article class="round padding surface-container"><h4>Site Settings</h4><div class="space"></div><form method="post">{{ .csrf_token }}<div class="grid"><div class="s12 m6"><div class="field label border round"><input type="text" name="site_name" value="{{ .setting.SiteName }}"><label>Site Name</label></div></div><div class="s12 m6"><div class="field label border round"><input type="email" name="email" value="{{ .setting.Email }}"><label>Site Email</label></div></div><div class="s12"><div class="field textarea label border round"><textarea name="site_description">{{ .setting.SiteDescription }}</textarea><label>Site Description</label></div></div><div class="s12 m6"><div class="field label border round"><select name="log_level">{{ range .log_level_choices }}<option value="{{ . }}" {{ if eq $.setting.LogLevel . }}selected{{ end }}>{{ . }}</option>{{ end }}</select><label>Log Level</label></div></div><div class="s12 m6"><div class="field label border round"><input type="text" name="gotify_url" value="{{ .setting.GotifyURL }}"><label>Gotify URL</label></div></div><div class="s12 m6"><div class="field label border round"><input type="text" name="gotify_token" value="{{ .setting.GotifyToken }}"><label>Gotify Token</label></div></div><div class="s12 m6"><div class="field label border round"><input type="text" name="otel_endpoint" value="{{ .setting.OTelEndpoint }}"><label>OTel Endpoint</label></div></div><div class="s12 m6"><div class="field check round"><input type="checkbox" name="otel_enabled"{{ if .setting.OTelEnabled }} checked{{ end }} value="on"><label>Enable OpenTelemetry</label></div></div></div>
<div class="space"></div><h5>Email (SMTP)</h5><div class="grid"><div class="s12"><div class="field check round"><input type="checkbox" name="smtp_enabled"{{ if .setting.SMTPEnabled }} checked{{ end }} value="on"><label>Enable SMTP Email</label></div></div><div class="s12 m6"><div class="field label border round"><input type="text" name="smtp_host" value="{{ .setting.SMTPHost }}"><label>SMTP Host</label></div></div><div class="s12 m6"><div class="field label border round"><input type="text" name="smtp_port" value="{{ .setting.SMTPPort }}"><label>SMTP Port</label></div></div><div class="s12 m6"><div class="field label border round"><input type="text" name="smtp_user" value="{{ .setting.SMTPUser }}"><label>SMTP User</label></div></div><div class="s12 m6"><div class="field label border round"><input type="password" name="smtp_password" placeholder="{{ if .setting.SMTPPassword }}•••••••• (leave blank to keep){{ end }}"><label>SMTP Password</label></div></div><div class="s12 m6"><div class="field label border round"><input type="email" name="smtp_from_email" value="{{ .setting.SMTPFromEmail }}"><label>From Email</label></div></div><div class="s12 m6"><div class="field check round"><input type="checkbox" name="smtp_tls"{{ if .setting.SMTPTLS }} checked{{ end }} value="on"><label>Use TLS</label></div></div></div>
<div class="space"></div><nav class="right-align"><button type="submit" class="button primary round"><i>save</i> Save Settings</button></nav></form>
<div class="space"></div><form method="post" action="/dashboard/settings/test-email">{{ .csrf_token }}<nav class="right-align"><button type="submit" class="button border round"><i>mail</i> Send test email</button></nav></form></article></main>{{ template "admin_tail" . }}
