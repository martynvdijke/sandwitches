{{ template "head" . }}{{ template "navbar" . }}
<div class="space"></div>
<article class="round elevate padding" style="max-width:400px;margin:auto">
<h4>Reset Password</h4>
{{ if .token }}
<form method="post" action="/reset-password">
<input type="hidden" name="token" value="{{ .token }}">
<div class="field label border round"><input type="password" name="password1" required minlength="8" autocomplete="new-password"><label>New password</label></div>
<div class="field label border round"><input type="password" name="password2" required autocomplete="new-password"><label>Confirm new password</label></div>
<div class="space"></div>
<button type="submit" class="button primary round">Reset Password</button>
</form>
{{ else }}
<p>The reset link is missing or invalid. <a href="/forgot-password">Request a new one</a>.</p>
{{ end }}
</article>
{{ template "tail" . }}
