{{ template "head" . }}{{ template "navbar" . }}
<div class="space"></div>
<article class="round elevate padding" style="max-width:400px;margin:auto">
<h4>Login</h4>
{{ if .error }}<div class="padding small-round" style="background:var(--error-container);color:var(--on-error-container);margin-bottom:12px">{{ .error }}</div>{{ end }}
<form method="post" action="/login">
<div class="field label border round"><input type="text" name="username" required autocomplete="username"><label>Username</label></div>
<div class="field label border round"><input type="password" name="password" required autocomplete="current-password"><label>Password</label></div>
<div class="space"></div>
<button type="submit" class="button primary round">Login</button>
</form>
{{ if .oidc_enabled }}<div class="space"></div><a href="/login/oidc" class="button secondary round fill">Login with Authelia</a>{{ end }}
<p>Don't have an account? <a href="/signup">Sign up</a> · <a href="/forgot-password">Forgot password?</a></p>
</article>
{{ template "tail" . }}
