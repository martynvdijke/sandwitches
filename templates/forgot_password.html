{{ template "head" . }}{{ template "navbar" . }}
<div class="space"></div>
<article class="round elevate padding" style="max-width:400px;margin:auto">
<h4>Forgot Password</h4>
{{ if .sent }}
<p>If an account exists for that email address, a password reset link has been sent. Check your inbox.</p>
{{ else }}
<form method="post" action="/forgot-password">
<div class="field label border round"><input type="email" name="email" required autocomplete="email"><label>Email</label></div>
<div class="space"></div>
<button type="submit" class="button primary round">Send reset link</button>
</form>
{{ end }}
<p><a href="/login">Back to login</a></p>
</article>
{{ template "tail" . }}
