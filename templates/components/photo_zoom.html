{{ define "photo_zoom" }}
<dialog id="photo-zoom" aria-label="Photo viewer">
    <button type="button" id="photo-zoom-close" class="circle" aria-label="Close photo viewer" title="Close">
        <i>close</i>
    </button>
    <div id="photo-zoom-stage">
        <img id="photo-zoom-img" alt="" draggable="false">
    </div>
</dialog>
{{ end }}
