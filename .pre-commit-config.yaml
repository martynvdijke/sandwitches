repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
-   repo: local
    hooks:
    -   id: go-vet
        name: go-vet
        entry: go vet ./...
        language: system
        pass_filenames: false
    -   id: gofmt
        name: gofmt
        entry: gofmt -l .
        language: system
        pass_filenames: false
