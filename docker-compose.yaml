services:
  sandwitches:
    image: martynvandijke/sandwitches:latest
    container_name: sandwitches
    environment:
     - ALLOWED_HOSTS=localhost,127.0.0.1,[::1]
     - CSRF_TRUSTED_ORIGINS=http://localhost:6270,http://127.0.0.1:6270
     - SECRET_KEY=superdupersecretkey
     - DATABASE_FILE=/config/db.sqlite3
     - MEDIA_ROOT=/config/media
     - OIDC_ENABLED=false
     - OIDC_ISSUER=https://authelia.vandijke.xyz
     - OIDC_CLIENT_ID=
     - OIDC_CLIENT_SECRET_FILE=/run/secrets/oidc_secret
     - OIDC_REDIRECT_URL=https://sandwitches.vandijke.xyz/api/auth/oidc/callback
     - OIDC_SCOPES=openid email profile groups
    ports:
      - 6270:6270
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6270/api/v1/ping"]
      interval: 5s
      timeout: 10s
      retries: 3
    volumes:
      - /path/to/sandwitches:/config
    restart: always